      panes:
        - sleep 1; clear
        - sleep 1; clear
  - shell: 
      layout: bac0,484x93,0,0[484x35,0,0{242x35,0,0,3,120x35,243,0,8,120x35,364,0[120x17,364,0,9,120x17,364,18,10]},484x36,0,36,11,484x20,0,73,14]
      #  layout: 2200,484x93,0,0[484x35,0,0{242x35,0,0,3,120x35,243,0,8,120x35,364,0[120x17,364,0,9,120x17,364,18,14]},484x44,0,36,10,484x12,0,81,11]
